services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polmart_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: polmart_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: polmart_postgres
    environment:
      POSTGRES_DB: polmart_db
      POSTGRES_USER: polmart_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"   
    volumes:
      - polmart_pgdata:/var/lib/postgresql/data

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polmart_scheduler
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - db

volumes:
  polmart_pgdata: